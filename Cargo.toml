[package]
name = "extauthz-cfzt"
version = "0.3.3"
edition = "2021"
include = ["src/**/*.rs"]

[dependencies]
envoy-types = "0.2.0"
phf = { version = "0.11.2", features = ["macros"]}
tokio = { version = "1.29.1", features = ["full", "rt-multi-thread", "signal"] }
tonic = "0.9.2"
tokio-cron-scheduler = "0.13.0"
tokio-stream = { version = "0.1.14", features = ["net"] }
jsonwebtoken = "9.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-cfzt-validator = "0.5.0"
url = "2.5.4"
log = "0.4.22"
env_logger = "0.11.5"
clap = { version = "4.4", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2.0.12"
prometheus = "0.14.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
hyper = { version = "1.6.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.16", features = ["http1", "server", "client", "tokio"], default-features = false }
tokio-util = { version = "0.7.15", features = ["compat"] }

[target.'cfg(all(target_env = "musl", target_pointer_width = "64"))'.dependencies.mimalloc]
version = "0.1.43"
